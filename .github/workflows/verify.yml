name: Verify Ascent
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/five-year-crucible]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # The inherited lockfile is missing two optional @emnapi dependencies under Node 24.
      # Reconcile it in the ephemeral runner until a refreshed lockfile is committed.
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Print lockfile package metadata for remediation
        run: |
          node -e 'const p=require("./package-lock.json").packages; for(const k of ["node_modules/@emnapi/runtime","node_modules/@emnapi/core"]) console.log("LOCKFIX",k,JSON.stringify(p[k]))'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
